<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAHIS お薬手帳 QRコード生成ツール (焼津総合版)</title>
    <!-- Tailwind CSS (Offline built version) -->
    <link rel="stylesheet" href="tailwind.min.css">
    <!-- QR Code Generator (Structured Append 対応パッチ済みローカル版) -->
    <script src="qrcode-generator.js"></script>
    <!-- Encoding Library (for Shift-JIS conversion required by JAHIS/medical systems) -->
    <script src="encoding.min.js"></script>
    <!-- ブラウザ判定 (IE/EdgeHTMLの警告) -->
    <script>
        (function() {
            var ua = window.navigator.userAgent.toLowerCase();
            var isIE = ua.indexOf('msie') !== -1 || ua.indexOf('trident') !== -1;
            // エラー原因である Symbol等が使えないブラウザを判定
            if (isIE || typeof Symbol === 'undefined') {
                alert("【警告】\n本ツールは Google Chrome での使用を推奨しています。\n現在のブラウザ (Internet Explorer互換モードなど) では、プログラムが対応しておらずエラーが発生します。\n必ず「Google Chrome」で開き直してご利用ください。");
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Compact specific styles */
        .compact-input {
            padding: 0.125rem 0.5rem; /* 2px 8px */
            font-size: 0.875rem;
            line-height: 1.25rem;
            border-radius: 0.25rem;
            border: 1px solid #d1d5db;
            width: 100%;
        }
        /* Preview UI specific styles */
        .preview-input {
            border: none;
            background: transparent;
            border-bottom: 1px dashed #fbbf24; /* yellow-400 */
            padding: 0 2px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .preview-input:hover, .preview-input:focus {
            background: #fff;
            border-bottom: 1px solid #3b82f6;
            border-radius: 2px;
        }
        .preview-area {
            border: 1px dashed #fbbf24;
            background: transparent;
            padding: 2px 4px;
            width: 100%;
            border-radius: 4px;
            resize: vertical;
            outline: none;
            font-family: inherit;
            min-height: 1.5rem;
        }
        .preview-area:hover, .preview-area:focus {
            background: #fff;
            border: 1px solid #3b82f6;
        }
        /* 自動補完された項目の強調スタイル */
        .supplemented-field {
            background-color: #fee2e2 !important;
            border: 2px solid #ef4444 !important;
            color: #991b1b !important;
            border-radius: 4px !important;
            padding: 1px 4px !important;
        }
        .supplemented-badge {
            display: inline-flex;
            align-items: center;
            background-color: #ef4444;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 9999px;
            margin-left: 4px;
            white-space: nowrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .supplemented-banner {
            background-color: #fef2f2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4">
    <div class="container mx-auto max-w-7xl">
        <header class="mb-4 text-center">
            <h1 class="text-2xl font-bold text-blue-700">お薬手帳 QR生成ツール</h1>
        </header>

        <main class="bg-white shadow-md rounded-lg p-4 md:p-6">
            <form id="jahisForm">
                
                <!-- 医療機関情報（折りたたみ可能・通常は隠す） -->
                <details class="bg-gray-50 p-2 rounded border border-gray-200 text-xs mb-4">
                    <summary class="font-bold cursor-pointer text-gray-600 hover:text-blue-600">
                        ▶ 医療機関情報の確認・変更
                    </summary>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mt-2 p-2">
                        <div>
                            <label class="block text-gray-600 mb-1">機関名称</label>
                            <input type="text" id="hospitalName" value="焼津市立総合病院" class="compact-input">
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1">都道府県(静岡=22)</label>
                            <input type="number" id="prefCode" value="22" class="compact-input">
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1">点数表コード(1:医科)</label>
                            <select id="tensuCode" class="compact-input">
                                <option value="1" selected>1: 医科（病院）</option>
                                <option value="4">4: 調剤（薬局）</option>
                                <option value="3">3: 歯科</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1">機関コード</label>
                            <input type="text" id="hospitalCode" value="5111204" class="compact-input">
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1">郵便番号</label>
                            <input type="text" id="hospitalZip" value="4258505" class="compact-input">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-gray-600 mb-1">住所</label>
                            <input type="text" id="hospitalAddr" value="静岡県焼津市道原1000" class="compact-input">
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-1">電話番号</label>
                            <input type="text" id="hospitalTel" value="054-623-3111" class="compact-input">
                        </div>
                        <!-- 処方元・医師情報 -->
                        <div class="border-t border-gray-200 mt-2 pt-2 md:col-span-4 grid grid-cols-1 md:grid-cols-4 gap-2">
                            <div>
                                <label class="block text-gray-600 mb-1">処方元医療機関</label>
                                <input type="text" id="prescHospitalName" value="焼津市立総合病院" class="compact-input">
                            </div>
                            <div>
                                <label class="block text-gray-600 mb-1">処方元コード</label>
                                <input type="text" id="prescHospitalCode" value="5160058" class="compact-input">
                            </div>
                            <div>
                                <label class="block text-gray-600 mb-1">処方医氏名 <span class="text-xs text-red-500 font-normal">(空欄時はレコード非出力)</span></label>
                                <input type="text" id="doctorName" value="" class="compact-input">
                            </div>
                            <div>
                                <label class="block text-gray-600 mb-1">診療科</label>
                                <input type="text" id="deptName" value="" class="compact-input">
                            </div>
                        </div>
                    </div>
                </details>

                <!-- 1. 患者情報＆日時表示 (1行にコンパクトに配置) -->
                <section class="mb-4 pb-4 border-b border-gray-200">
                    <div class="grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
                        <div class="md:col-span-1">
                            <label class="block text-xs font-medium text-gray-700 mb-1">氏名</label>
                            <input type="text" id="patientName" value="" class="compact-input">
                            <p id="nameError" class="text-xs text-red-500 mt-1 hidden text-center md:text-left leading-tight" style="font-size: 10px;">姓と名の間に全角スペースが必要です</p>
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-xs font-medium text-gray-700 mb-1">フリガナ</label>
                            <input type="text" id="patientKana" value="" class="compact-input">
                            <p id="kanaError" class="text-xs text-red-500 mt-1 hidden text-center md:text-left leading-tight" style="font-size: 10px;">姓と名の間に全角スペースが必要です</p>
                        </div>
                        <div>
                            <span class="block text-xs font-medium text-gray-700 mb-1">性別</span>
                            <div class="flex items-center space-x-3 bg-gray-50 border border-gray-300 rounded px-2 py-1 h-7">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="patientSex" value="1" class="form-radio h-3 w-3 text-blue-600" checked>
                                    <span class="ml-1 text-xs text-gray-800">男</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="patientSex" value="2" class="form-radio h-3 w-3 text-blue-600">
                                    <span class="ml-1 text-xs text-gray-800">女</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">生年月日</label>
                            <input type="text" id="patientDob" value="" placeholder="S25/8/25" class="compact-input">
                            <p id="dobError" class="text-xs text-red-500 mt-1 hidden text-center md:text-left leading-tight" style="font-size: 10px;">生年月日の入力は必須です（8桁の数字等）</p>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">交付日</label>
                            <input type="date" id="dispenseDate" class="compact-input">
                        </div>
                    </div>
                    <!-- アレルギー・副作用・既往歴 -->
                    <div class="mt-3">
                        <label class="block text-xs font-medium text-red-600 mb-1">副作用・アレルギー・既往歴（1行1項目）</label>
                        <textarea id="patientHistory" class="w-full h-16 p-2 border border-red-200 bg-red-50 rounded text-xs focus:ring-red-500 focus:border-red-500" placeholder="例: 花粉症（R03.12.23）"></textarea>
                    </div>
                </section>

                <!-- 一括貼り付け -->
                <section class="bg-blue-50 p-3 rounded border border-blue-100 mb-4">
                    <div class="flex justify-between items-center mb-2 sticky top-0 bg-blue-50 bg-opacity-95 z-20 py-2 border-b border-blue-100 shadow-sm px-1 -mx-1 -mt-1">
                        <h2 class="text-sm font-semibold text-blue-800">テキスト抽出 (一括貼り付け)</h2>
                        <button type="button" id="bulkParseBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-xs transition font-bold shadow-md transform hover:scale-105">
                            ↓ 解析してリストに追加
                        </button>
                    </div>
                    <textarea id="bulkInput" class="w-full h-12 p-1.5 border border-blue-200 rounded text-xs focus:ring-blue-500 focus:border-blue-500" placeholder="カルテの処方テキストをまるごと貼り付けてください（階層形式、Rp番号表記なども自動でパースします）"></textarea>
                </section>

                <!-- 医薬品リスト -->
                <section class="mb-4">
                    <div class="flex justify-between items-center bg-gray-100 p-2 rounded-t border-b border-gray-200">
                        <h2 class="text-sm font-bold text-gray-700">処方薬リスト</h2>
                        <div class="flex gap-2">
                            <button type="button" id="addCommentBtn" class="bg-purple-500 hover:bg-purple-600 text-white px-2 py-1 rounded text-xs transition">
                                💬 コメント行追加
                            </button>
                            <button type="button" id="addMedBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-2 py-1 rounded text-xs transition">
                                ＋ 空行追加
                            </button>
                        </div>
                    </div>
                    
                    <!-- 列ヘッダ (PC用表示) -->
                    <div class="hidden md:flex text-xs font-medium text-gray-500 bg-gray-50 px-2 py-1 border-b border-gray-200">
                        <div class="px-1 text-left w-full">登録されるお薬データ（各項目は自動抽出されますが、手動修正も可能です）</div>
                    </div>

                    <div id="medicationsList" class="border border-t-0 border-gray-200 rounded-b">
                        <!-- 薬品項目テンプレートがここに追加される -->
                    </div>
                </section>

                <!-- 処方全体へのコメント -->
                <section class="mb-2 pb-2 border-b border-gray-200">
                    <h2 class="text-sm font-semibold text-purple-700 mb-1">【任意】処方全体へのコメント <span class="text-xs font-normal text-gray-500">（「コメント」薬剤行として出力 / 改行で複数行入力可）</span></h2>
                    <textarea id="globalMemo" class="w-full h-12 p-1.5 border border-purple-200 bg-purple-50 rounded text-xs focus:ring-purple-500 focus:border-purple-500" placeholder="例：○○による変更・全体的な申し送り事項など（改行で複数件入力可）"></textarea>
                </section>

                <!-- 生成ボタン -->
                <div class="flex justify-center">
                    <button type="button" id="generateBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-12 rounded shadow-md transform transition hover:scale-105 text-base">
                        QRコードを生成する
                    </button>
                </div>
            </form>
        </main>

        <!-- 結果表示エリア -->
        <section id="resultSection" class="mt-6 bg-white shadow-md rounded-lg p-4 md:p-6 hidden">
            <h2 class="text-lg font-bold mb-3 text-center text-gray-800">生成結果</h2>

            <!-- 統計バナー -->
            <div id="statsDisplay" class="flex flex-wrap items-center justify-center gap-2 text-sm bg-blue-50 rounded-lg px-4 py-2 mb-4 border border-blue-100 text-gray-700"></div>

            <!-- お薬手帳プレビューエリア -->
            <div id="richPreviewContainer" class="mb-6 bg-yellow-50 border border-yellow-200 rounded-lg p-4 pt-5 text-gray-800 shadow-inner relative">
                <div class="absolute -top-3 left-4 bg-yellow-400 text-yellow-900 px-3 py-0.5 rounded-full text-xs font-bold shadow border border-yellow-500">手帳プレビュー (クリックして直接編集)</div>
                <div id="richPreviewContent" class="mt-1"></div>
                <div class="text-center mt-4 hidden" id="previewUpdateArea">
                    <span class="text-xs text-red-500 font-bold mr-2">※ 変更があります</span>
                    <button type="button" id="updateFromPreviewBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition transform hover:scale-105">内容を更新してQRコードを再作成</button>
                </div>
            </div>

            <!-- QRコードエリア（横スクロール対応・全幅） -->
            <div class="mb-5">
                <p class="text-xs text-blue-600 font-bold mb-2 text-center">※複数枚の場合は左から順番にスキャンしてください</p>
                <div id="qrcodeContainer" class="flex flex-nowrap gap-4 overflow-x-auto py-3 px-3 bg-gray-50 rounded border border-gray-200 justify-start items-center" style="min-height: 100px;"></div>
            </div>

            <!-- JAHISデータプレビュー（折りたたみ） -->
            <details class="bg-gray-50 p-2 rounded border border-gray-200">
                <summary class="text-xs font-bold text-gray-700 cursor-pointer hover:text-blue-600">
                    ▶ 生成されたCSVデータ（生データ確認用）
                </summary>
                <div class="mt-2">
                    <textarea id="csvPreview" class="w-full h-48 p-2 border border-gray-300 rounded text-xs font-mono bg-white resize-y" readonly></textarea>
                </div>
            </details>
        </section>
    </div>

    <!-- 薬品行のテンプレート -->
    <template id="medTemplate">
        <div class="med-item flex flex-col border-b border-gray-300 p-0.5 hover:bg-yellow-50 bg-white group">
            <div class="flex flex-wrap md:flex-nowrap items-center gap-1 w-full relative pr-8">
                <input type="text" class="med-name compact-input border-gray-300 focus:border-blue-500 font-bold flex-grow" style="min-width: 120px;" placeholder="薬品名">
                <input type="text" class="med-dose compact-input border-gray-300 text-center px-1 shrink-0" style="width: 48px;" placeholder="量">
                <input type="text" class="med-unit compact-input border-gray-300 text-center px-1 shrink-0" style="width: 60px;" placeholder="単位">
                <input type="text" class="med-code compact-input border-gray-300 text-[10px] font-mono px-1 shrink-0" style="width: 110px;" placeholder="YJｺｰﾄﾞ">
                <input type="text" class="med-usage compact-input border-green-300 bg-green-50 focus:border-green-500 text-xs w-full md:w-20" placeholder="用法">
                <button type="button" class="remove-med text-gray-400 hover:text-white hover:bg-red-500 p-1 w-7 h-7 flex items-center justify-center bg-gray-100 rounded transition-colors shadow-sm absolute right-0 top-1/2 -translate-y-1/2">
                    <span class="font-bold">×</span>
                </button>
            </div>
            <div class="w-full pr-8">
                <textarea rows="1" class="med-memo compact-input border-purple-300 bg-purple-50 focus:border-purple-500 text-purple-800 text-xs w-full resize-y leading-tight" placeholder="メモ・特記事項・持参薬情報等"></textarea>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
