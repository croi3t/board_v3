<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>病棟業務日誌 入力支援ツール v20</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f9; }
        .control-box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 2px solid #3498db; }
        .btn { padding: 10px 20px; margin-right: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .panel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .work-btn { padding: 15px; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="control-box">
        <h2>🛠 社内PC対応・手動管理モード</h2>
        <p>※社内PCのため自動フォルダ同期は使用せず、手動でファイルを読み書きします。</p>
        <button class="btn" onclick="document.getElementById('manualFileInput').click()">📂 共有ファイルを読込</button>
        <input type="file" id="manualFileInput" style="display:none" onchange="handleManualLoad(event)">
        <button class="btn" onclick="handleManualSave()">💾 ダウンロードして上書き保存</button>
    </div>

    <div id="panelContainer" class="panel-grid"></div>

    <script>
        // パネル定義
        const defaultJobs = [
            { outputName: "① 投薬・注射状況把握", name: "📋投薬・注射把握", duration: 30, isTarget: true, color: "#2980b9" },
            { outputName: "② 安全性周知・相談・危険薬説明", name: "⚠️安全性周知・相談", duration: 30, isTarget: true, color: "#3498db" },
            { outputName: "③ 持参薬確認、服薬計画", name: "💊持参薬確認・計画", duration: 45, isTarget: true, color: "#4a90e2" },
            { outputName: "④ 相互作用確認（投薬前）", name: "🔍相互作用確認", duration: 15, isTarget: true, color: "#5c9ded" },
            { outputName: "⑤ PBPM(処方、検査ｵｰﾀﾞ作成・変更)", name: "💻PBPM業務", duration: 20, isTarget: true, color: "#2574a9" },
            { outputName: "⑥ 処方提案", name: "💡処方提案", duration: 15, isTarget: true, color: "#1f4e79" },
            { outputName: "⑦ 医薬品の適正な保管・管理", name: "📦適正保管・管理", duration: 15, isTarget: true, color: "#6bb9f0" },
            { outputName: "⑧ 無菌調製(TPN、抗がん剤)", name: "🧪無菌調製業務", duration: 45, isTarget: true, color: "#4b0082" },
            { outputName: "⑨ TDM・投与量計算", name: "📊TDM・投与量計算", duration: 30, isTarget: true, color: "#2980b9" },
            { outputName: "⑩ カンファレンス・回診参加", name: "👥カンファ・回診参加", duration: 30, isTarget: true, color: "#3498db" },
            { outputName: "⑪ 病棟業務日誌の作成", name: "📝業務日誌の作成", duration: 15, isTarget: true, color: "#4a90e2" },
            { outputName: "⑫ その他", name: "📁その他業務1", duration: 30, isTarget: true, color: "#5c9ded" },
            { outputName: "⑫ その他", name: "📁その他業務2", duration: 30, isTarget: true, color: "#2574a9" },
            { outputName: "⑫ その他", name: "📁その他業務3", duration: 30, isTarget: true, color: "#1f4e79" },
            { outputName: "⑬ 薬剤管理指導 (算定外)", name: "🚪薬剤管理指導(外)", duration: 45, isTarget: false, color: "#7f8c8d" },
            { outputName: "⑭ 退院時指導 (算定外)", name: "🚪退院時指導(外)", duration: 30, isTarget: false, color: "#95a5a6" },
            { outputName: "⑮ チーム医療 (算定外)", name: "🤝チーム医療(外)", duration: 30, isTarget: false, color: "#a6b1b2" },
            { outputName: "⑮-2 中央業務", name: "📦中央業務(外)", duration: 120, isTarget: false, color: "#bdc3c7" },
            { outputName: "⑯ その他", name: "☕昼休憩", duration: 60, isTarget: false, color: "#8c8c8c" },
            { outputName: "⑯ その他", name: "📁その他業務(外)2", duration: 30, isTarget: false, color: "#b8860b" }
        ];

        let appData = { jobs: defaultJobs };

        // 画面構築
        function renderPanels() {
            const container = document.getElementById("panelContainer");
            container.innerHTML = "";
            appData.jobs.forEach(job => {
                let btn = document.createElement("button");
                btn.className = "work-btn";
                btn.style.backgroundColor = job.color;
                btn.innerText = `${job.name}\n(${job.duration}分)`;
                btn.onclick = () => alert(job.name + "が選択されました（タイムライン生成ロジックは統合可能です）");
                container.appendChild(btn);
            });
        }

        // 手動読み込み
        function handleManualLoad(event) {
            const reader = new FileReader();
            reader.onload = (e) => {
                appData = JSON.parse(e.target.result);
                renderPanels();
                alert("読み込みました");
            };
            reader.readAsText(event.target.files[0]);
        }

        // 手動保存
        function handleManualSave() {
            const blob = new Blob([JSON.stringify(appData)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "ward_diary_shared_data.json";
            a.click();
        }

        renderPanels();
    </script>
</body>
</html>
